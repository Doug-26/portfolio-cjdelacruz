<section class="hero">
  <p class="kicker mono-label" appReveal="fade">Hello — I'm</p>
  <h1 appReveal="slide-up" [revealDelay]="60">
    Christian Jay<br />
    De La Cruz.
  </h1>
  <p class="role mono-label" appReveal="slide-up" [revealDelay]="120">
    {{ profile.title }} / {{ profile.focus }}
  </p>
  <p class="tagline" appReveal="slide-up" [revealDelay]="180">
    {{ profile.tagline }}
  </p>

  <div class="cta-row" appReveal="slide-up" [revealDelay]="240">
    <a class="btn btn-primary" href="#projects">
      View Projects <span aria-hidden="true">→</span>
    </a>
    <a
      class="btn btn-secondary"
      [href]="profile.resumeFile"
      [attr.download]="profile.resumeDownloadName"
    >
      Download Resume <span aria-hidden="true">↓</span>
    </a>
    <a class="btn btn-ghost" href="#contact">Get in Touch</a>
  </div>
</section>
