<section class="about section" id="about">
  <div class="section-head" appReveal="slide-up">
    <span class="eyebrow"><b>01</b> / About</span>
    <h2>A bit about me.</h2>
  </div>

  <p class="bio" appReveal="slide-up" [revealDelay]="60">{{ profile.bio }}</p>

  <div class="stats" appReveal="slide-up" [revealDelay]="120">
    <div class="stat">
      <div class="stat-num">{{ profile.yearsExperience }}</div>
      <div class="mono-label">Years of experience</div>
    </div>
    <div class="stat">
      <div class="stat-num">{{ profile.projects.length }}</div>
      <div class="mono-label">Projects shipped</div>
    </div>
    <div class="stat">
      <div class="stat-num">{{ profile.certifications.length }}</div>
      <div class="mono-label">Certifications</div>
    </div>
    <div class="stat">
      <div class="stat-num">v15→v22</div>
      <div class="mono-label">Angular versions</div>
    </div>
  </div>
</section>
